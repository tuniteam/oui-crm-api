# ============================================
# OUI-CRM — pile de déploiement, UAT et production (SPEC-20)
#
#   docker compose --env-file .env.prod up -d --build
#
# Tout ce qui varie d'un environnement à l'autre vit dans .env.<env> — jamais versionné, modèle :
# .env.example. Ce fichier ne porte que la topologie de la pile, et aucune valeur secrète par
# défaut : une variable obligatoire absente arrête Compose en la nommant.
#
# Premier déploiement d'une base de production (dump) : voir README, « Déploiement Docker ».
# ============================================

name: ouicrm-${DEPLOY_ENV:?DEPLOY_ENV absent — passer le fichier avec --env-file .env.<env>}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # Répertoire parent : l'image 18 range ses données sous /var/lib/postgresql/18/.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    ports:
      # Les URL présignées sont servies au navigateur : PRESIGNED_PUBLIC_URL doit pointer ici.
      - '${MINIO_PUBLIC_PORT:-9000}:9000'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # L'API vérifie le bucket au démarrage sans le créer : il est créé ici, une fois, puis le
  # conteneur s'arrête.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
      MINIO_BUCKET: ${MINIO_BUCKET:?}
    entrypoint: ['/bin/sh', '-c']
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$MINIO_BUCKET"

  api:
    build:
      context: .
      target: production
    image: ouicrm-api:${DEPLOY_ENV}
    restart: unless-stopped
    env_file:
      - .env.${DEPLOY_ENV}
    environment:
      # Topologie de la pile, identique pour tous les environnements : elle écrase les valeurs
      # du fichier, qui servent au poste de développement.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: '3001'
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
    ports:
      - '${API_PUBLIC_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
