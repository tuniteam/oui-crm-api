# ============================================
# Backend - Docker Compose (Development)
# ============================================
# Usage:
#   docker-compose -f docker-compose.dev.yml up -d
#   docker-compose -f docker-compose.dev.yml logs -f api
# ============================================
# Features:
#   - Hot-reload with source code mounting
#   - All devDependencies available
#   - Debug mode enabled
# ============================================

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:15-alpine
    container_name: db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ouicrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ouicrm_password}
      POSTGRES_DB: ${POSTGRES_DB:-ouicrm_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ouicrm} -d ${POSTGRES_DB:-ouicrm_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ouicrm-network-dev

  # ===========================================
  # MinIO (object storage: templates, documents, imports)
  # Console: http://localhost:9001
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: ouicrm-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ouicrm}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ouicrm_minio_password}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '9001:9001'
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ouicrm-network-dev

  # Creates the bucket once MinIO is ready, then exits
  minio-init:
    image: minio/mc:latest
    container_name: ouicrm-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-ouicrm} ${MINIO_SECRET_KEY:-ouicrm_minio_password} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-ouicrm} &&
      echo 'bucket ready'"
    networks:
      - ouicrm-network-dev

  # ===========================================
  # Mailpit (SMTP sink for development)
  # Web UI: http://localhost:8025 — SMTP: localhost:1025
  # ===========================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: ouicrm-mailpit-dev
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - ouicrm-network-dev

  # ===========================================
  # OUI-CRM API (Development with Hot Reload)
  # ===========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ouicrm-api-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ouicrm}:${POSTGRES_PASSWORD:-ouicrm_password}@db:5432/${POSTGRES_DB:-ouicrm_db}?schema=public
    ports:
      - '${PORT:-3000}:3000'
      - '9229:9229' # Debug port
    volumes:
      # Mount source code for hot-reload
      - .:/app
      - /app/node_modules # Exclude node_modules from mount
    command: npm run start:dev
    networks:
      - ouicrm-network-dev

  # ===========================================
  # Prisma Studio (Database GUI)
  # ===========================================
  prisma-studio:
    image: node:22-alpine
    container_name: ouicrm-prisma-studio-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ouicrm}:${POSTGRES_PASSWORD:-ouicrm_password}@db:5432/${POSTGRES_DB:-ouicrm_db}?schema=public
    ports:
      - '5555:5555'
    volumes:
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
    working_dir: /app
    command: sh -c "npm install prisma @prisma/client && npx prisma studio --port 5555 --browser none"
    networks:
      - ouicrm-network-dev

# ===========================================
# Volumes
# ===========================================

volumes:
  postgres_data_dev:
    name: ouicrm_postgres_data_dev
    driver: local
  minio_data_dev:
    name: ouicrm_minio_data_dev
    driver: local
# ===========================================
# Networks
# ===========================================
networks:
  ouicrm-network-dev:
    driver: bridge
